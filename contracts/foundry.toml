[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000

[rpc_endpoints]
rhc = "${RHC_MAINNET_RPC_URL}"
rhc_testnet = "${RHC_TESTNET_RPC_URL}"

[fuzz]
runs = 1024
