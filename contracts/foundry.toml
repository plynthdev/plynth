[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
# Vendored without git metadata using forge install --no-git (remappings.txt):
# OpenZeppelin contracts v5.7.0; forge-std v1.17.0 (c6fa5d8).
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
fs_permissions = [{ access = "read-write", path = "../app/deployments" }, { access = "read", path = "test/consumer/verifiers/fixtures" }, { access = "read", path = "test/consumer/fixtures" }, { access = "read", path = "test/treasury/fixtures" }]

[lint]
# Generated by bb (circuits/scripts/build.sh); not hand-maintained.
ignore = ["src/consumer/verifiers/TransferVerifier.sol", "src/consumer/verifiers/SwapVerifier.sol", "src/consumer/verifiers/SettleVerifier.sol", "src/consumer/verifiers/WithdrawVerifier.sol", "src/consumer/verifiers/ThresholdHoldingsVerifier.sol", "src/consumer/verifiers/ThresholdSavingsVerifier.sol", "src/consumer/verifiers/TreasuryCloseVerifier.sol"]

[rpc_endpoints]
rhc = "${RHC_MAINNET_RPC_URL}"
rhc_testnet = "${RHC_TESTNET_RPC_URL}"

[fuzz]
runs = 1024
