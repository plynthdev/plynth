# CI for contracts, circuits, services and SDK. GitHub-hosted runners, no secrets, read-only token.
# Every action is pinned to a full commit SHA (the tag is in the comment); every downloaded tool is pinned to a
# version and checked against its published SHA-256. .github/scripts/check-hygiene.py enforces both.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # daily: the live mainnet deployment still matches app/deployments/4663.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.4
  BUN_VERSION: 1.4.2
  NARGO_VERSION: 1.0.0-beta.25
  NARGO_SHA256: bf3410ab94933a4aebd1f988b67ae974c6c227f9456ed0f1e4a3716bb8a30fe9
  BB_VERSION: 5.2.0
  BB_SHA256: 17ab8476961728cdc5c69b6c4ff427c9092cef11d1e0b0166929a0417dfa7cfb
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SLITHER_VERSION: 0.11.6
  SEMGREP_VERSION: 1.181.0

jobs:
  hygiene:
    name: hygiene (pins, pragmas, README vs deployments, public-guard, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependency pins, frozen installs, fixed pragmas, pinned actions
        run: python3 .github/scripts/check-hygiene.py
      - name: README deployment section matches app/deployments
        run: python3 .github/scripts/readme-deployments.py --check
      - name: public-guard (no keys, no private material)
        run: bash .githooks/public-guard.sh
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .github/gitleaks.toml --redact --no-banner

  contracts:
    name: forge test (invariants >= 100k calls, ci profile)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: forge build
        working-directory: contracts
        run: forge build --sizes --no-lint
      - name: forge test
        working-directory: contracts
        run: forge test

  coverage:
    name: forge coverage (whole project)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: forge coverage (src only; tests compile without the optimizer too)
        working-directory: contracts
        run: forge coverage --no-match-coverage '(test|script|lib|src/testnet)/' --report summary

  slither:
    name: slither (scoped, triaged)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: Install slither
        run: python -m pip install --disable-pip-version-check "slither-analyzer==${SLITHER_VERSION}"
      - name: slither (generated verifiers excluded; Medium/High must be triaged)
        working-directory: contracts
        run: bash script/slither.sh

  semgrep:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: semgrep (WARNING and ERROR fail)
        run: bash .github/scripts/semgrep.sh

  circuits:
    name: circuits (nargo test, verifier freshness, proving)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install nargo and bb (versions from circuits/VERSIONS, checksums verified)
        run: |
          grep -qx "nargo=${NARGO_VERSION}" circuits/VERSIONS
          grep -qx "bb=${BB_VERSION}" circuits/VERSIONS
          mkdir -p "$HOME/.nargo/bin" "$HOME/.bb"
          curl -sSfL -o nargo.tgz \
            "https://github.com/noir-lang/noir/releases/download/v${NARGO_VERSION}/nargo-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NARGO_SHA256}  nargo.tgz" | sha256sum -c -
          tar -xzf nargo.tgz -C "$HOME/.nargo/bin"
          curl -sSfL -o bb.tgz \
            "https://github.com/AztecProtocol/aztec-packages/releases/download/v${BB_VERSION}/barretenberg-amd64-linux.tar.gz"
          echo "${BB_SHA256}  bb.tgz" | sha256sum -c -
          tar -xzf bb.tgz -C "$HOME/.bb"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
      - name: nargo test (every circuit)
        working-directory: circuits
        run: |
          nargo --version
          for c in */Nargo.toml; do (cd "${c%/*}" && nargo test --silence-warnings); done
      - name: bun test (committed verifiers and constants match a fresh build; client-side proofs verify)
        working-directory: circuits
        run: |
          bun install --frozen-lockfile
          bun test

  sdk:
    name: sdk (build, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: build and test
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          bun run build
          bun test

  app:
    name: app (typecheck, unit and anvil tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/plynth_dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: forge build (the anvil tests deploy contracts/out, test mocks included)
        working-directory: contracts
        run: forge build --no-lint
      - name: sdk build (the app consumes sdk/dist)
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: install
        working-directory: app
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: app
        run: bun run typecheck
      - name: test
        working-directory: app
        run: bun test

  deployment:
    name: live mainnet deployment (state and bytecode vs this repo; read-only, public RPC)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # verify:explorer builds the commit that recorded the deployment
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: false
      - name: install
        run: |
          (cd sdk && bun install --frozen-lockfile && bun run build)
          (cd app && bun install --frozen-lockfile)
      - name: verify:deployment (owners, roles, timers, feeds, pools, caps; fails on any mismatch)
        working-directory: app
        run: bun run verify:deployment
      - name: verify:explorer (every deployed runtime code equals the recorded source; dry run, nothing submitted)
        working-directory: app
        run: bun run verify:explorer
