# Conservative treasury policy (T1). Bands are percent of NAV; caps are whole USD.
# Compile: bun app/scripts/policy-compiler.ts compile app/templates/conservative.yaml --controller 0x...
name: conservative
description: Mostly cash. Equity limited to the index and the largest names, small orders, tight drawdown limits.
network: mainnet
bands:
  cash: [70, 90]
  equity: [10, 30]
  basis: [0, 0]        # T1: no basis trade
hedge:
  netDeltaBps: [0, 0]  # T1: no hedge overlay
  maxLeverageX10: 0    # T1: no perps
limits:
  perOrderUsd: 50000
  perDayUsd: 250000
  approvalAboveUsd: 25000
  perNameFloatBps: 50  # hold at most 0.5% of a Stock Token's supply
  perVenueBps: 0       # T1: no venues
risk:
  noNewRiskOffHours: true
  pauseNewRiskAtDrawdownBps: -300
  deriskAtDrawdownBps: -600
periodDays: 30
controller: null       # pass --controller at compile time
instruments:
  - { asset: USDG, kind: cash }
  - { asset: steakUSDG, kind: cash_vault }
  - { asset: SPY, kind: stock_token }
  - { asset: AAPL, kind: stock_token }
  - { asset: MSFT, kind: stock_token }
venues: []
